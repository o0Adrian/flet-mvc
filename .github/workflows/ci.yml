name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.3" -e ".[dataframe,dev]"

      - name: Verify Flet version
        run: python -c "import importlib.metadata as m; assert m.version('flet') == '0.86.3'"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type-check
        run: python -m mypy

      - name: Test
        run: >
          python -m pytest
          --cov=flet_mvc
          --cov=mvc_commands
          --cov-report=term-missing

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=6,<7"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test the wheel
        run: |
          python -m venv /tmp/flet-mvc-wheel
          /tmp/flet-mvc-wheel/bin/python -m pip install dist/*.whl
          /tmp/flet-mvc-wheel/bin/python -c "import importlib.metadata as m; assert m.version('flet-mvc') == '1.0.0'; assert m.version('flet') == '0.86.3'"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          /tmp/flet-mvc-wheel/bin/flet-mvc start --destination basic
          /tmp/flet-mvc-wheel/bin/flet-mvc routes --destination routes
          /tmp/flet-mvc-wheel/bin/flet-mvc tabs --destination tabs
          /tmp/flet-mvc-wheel/bin/flet-mvc reactive --destination reactive
          for project in basic routes tabs reactive; do
            test -f "$project/.gitignore"
            test -f "$project/src/main.py"
            test -f "$project/tests/test_main.py"
            test ! -e "$project/app.py"
          done
          test -f basic/src/controllers/main.py
          test -f routes/src/views/secondary.py
          test -f tabs/src/models/settings.py
          test -f reactive/src/components/counter.py
          /tmp/flet-mvc-wheel/bin/python -m compileall -q basic routes tabs reactive

  integration:
    name: Flet desktop integration
    runs-on: macos-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            integration/pyproject.toml

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dataframe,dev]" "playwright>=1.55,<2"

      - name: Run dynamic and Pyodide browser integration tests
        run: python -m pytest integration/web_tests

      - name: Run Flet integration test
        working-directory: integration
        run: flet test macos --yes --no-rich-output
